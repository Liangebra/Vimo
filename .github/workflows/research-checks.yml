name: Vimo research checks
on:
  pull_request:
  push:
    branches: [main, feat/research-toolkit-tui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s research -v
      - run: node research/test_web.cjs
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python research/test_browser.py
      - name: Inspect demo media codecs
        run: |
          google-chrome --version
          for video in "使用图片/4f8f409a0db4f6a2072a851b1b4244fe.mp4" "使用图片/a442a73c389f4950d0a0d9806b0b28d9.mp4"; do
            ls -lh "$video"
            if command -v ffprobe >/dev/null 2>&1; then
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,codec_tag_string,pix_fmt,width,height -of json "$video"
            else
              file "$video"
            fi
          done
      - name: Verify real demo video extraction
        run: python research/test_browser.py
        env:
          VIMO_TEST_VIDEO: "1"

      - name: Upload research visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-visual-checks
          path: research/.test-output/
          if-no-files-found: ignore
          include-hidden-files: true
